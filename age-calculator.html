        <h2>Age Calculator</h2>

        <div class="convert-box mx-auto w-full rounded-3xl border border-slate-200 bg-white p-8 shadow-xl">

            <input type="date" id="dob">

            <button onclick="calculateAge()">
                <i class="fa-solid fa-calendar"></i> Calculate Age
            </button>

            <button onclick="clearData()" class="clear-btn">Clear</button>

            <div class="result" id="result"></div>

    <script>
        function calculateAge() {
            const dob = new Date(document.getElementById("dob").value);
            const today = new Date();

            let y = today.getFullYear() - dob.getFullYear();
            let m = today.getMonth() - dob.getMonth();
            let d = today.getDate() - dob.getDate();

            if (d < 0) { m--; d += 30; }
            if (m < 0) { y--; m += 12; }

            document.getElementById("result").innerText =
                `Age: ${y} years, ${m} months, ${d} days`;
        }

        function clearData() {
            document.getElementById("dob").value = "";
            document.getElementById("result").innerText = "";
        }
    </script>
