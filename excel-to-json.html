  <section class="converter mx-auto w-full max-w-6xl px-5 py-16">

    <span class="tool-section-kicker">SPREADSHEET CONVERTER</span>
    <h2>Excel to JSON Converter</h2>
    <p class="tool-section-intro">Turn workbook data into clean, structured JSON in a few seconds.</p>

    <div class="convert-box mx-auto w-full rounded-3xl border border-slate-200 bg-white p-8 shadow-xl">

      <label class="excel-upload-label" for="upload">
        <span class="excel-upload-icon"><i class="fa-solid fa-arrow-up-from-bracket" aria-hidden="true"></i></span>
        <span><strong>Choose an Excel workbook</strong><small>Select an .xlsx or .xls file from your device.</small></span>
      </label>

      <input type="file" id="upload" accept=".xlsx,.xls" style="background-color: white;">

      <div class="loader" id="loader">
        <div class="spinner"></div>
        Converting...
      </div>

      <button onclick="clearData()" class="clear-btn">
        <i class="fa-solid fa-rotate-left" aria-hidden="true"></i> Clear data
      </button>

      <label class="excel-output-label" for="json-output"><span>JSON output</span><span>Ready to copy or save</span></label>
      <textarea id="json-output" placeholder="Your formatted JSON will appear here..." aria-label="JSON output will appear here..."></textarea>

    </div>

  <script>

    const endpoint = "https://script.google.com/macros/s/AKfycbzKGNNlKFnxO9qZ7tZ2n4kjxsJBSANnaolmsYDu6UUYYWXBVUl_RQSC2Na8r0Q6HXTUTw/exec";

    const payload = {
      page: document.title || "landing",
      tool: "convotools_homepage",
      userAgent: navigator.userAgent,
      referrer: document.referrer,
      screen: screen.width + "x" + screen.height,
      timestamp: new Date().toISOString()
    };

    fetch(endpoint, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    document.getElementById('upload').addEventListener('change', handleFile)

    function handleFile(event) {
      var loader = document.getElementById('loader');
      loader.style.display = 'block';

      const file = event.target.files[0]

      if (!file) return

      const reader = new FileReader()

      reader.onload = function (event) {

        const data = new Uint8Array(event.target.result)

        const workbook = XLSX.read(data, { type: 'array' })

        const sheetName = workbook.SheetNames[0]

        const sheet = workbook.Sheets[sheetName]

        const json = XLSX.utils.sheet_to_json(sheet)

        document.getElementById('json-output').value =
          JSON.stringify(json, null, 2)
        loader.style.display = 'none';
      }

      reader.readAsArrayBuffer(file)

    }

    function clearData() {

      document.getElementById('upload').value = ''
      document.getElementById('json-output').value = ''
      var loader = document.getElementById('loader');
      loader.style.display = 'none';
    }

  </script>
