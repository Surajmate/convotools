    <h2>JSON to CSV</h2>

    <textarea id="input"></textarea>

    <button onclick="convert()">Convert</button>

    <textarea id="output"></textarea>

    <script>
        function convert() {
            let json = JSON.parse(input.value);
            let keys = Object.keys(json[0]);
            let csv = keys.join(",") + "\n";

            json.forEach(row => {
                csv += keys.map(k => row[k]).join(",") + "\n";
            });

            output.value = csv;
        }
    </script>
