    <section class="converter mx-auto w-full max-w-6xl px-5 py-16">

        <h2>Payment QR Generator</h2>

        <div class="convert-box mx-auto w-full rounded-3xl border border-slate-200 bg-white p-8 shadow-xl">

            <div class="form-group">
                <label for="amount">Amount</label>
                <input type="number" id="amount" placeholder="Enter amount" step="0.01">
            </div>

            <div class="form-group">
                <label for="upiId">UPI ID</label>
                <input type="text" id="upiId" placeholder="user@upi">
            </div>

            <button onclick="generateQR()">Generate QR Code</button>
            <div id="qrCode"></div>
        </div>

    </section>

    </a>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        function generateQR() {
            const amount = document.getElementById('amount').value;
            const upiId = document.getElementById('upiId').value;

            if (!amount || !upiId) {
                alert('Please fill all fields');
                return;
            }

            const upiString = `upi://pay?pa=${upiId}&am=${amount}`;
            const qrDiv = document.getElementById('qrCode');
            qrDiv.innerHTML = '';

            new QRCode(qrDiv, {
                text: upiString,
                width: 256,
                height: 256
            });
        }
    </script>
</body>
