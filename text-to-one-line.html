    <section class="converter mx-auto w-full max-w-6xl px-5 py-16">

        <h2>Convert Text to One Line</h2><br>

        <div class="tool-box">

            <textarea id="input" placeholder="Paste multiline text here..."></textarea>

            <textarea id="output" readonly placeholder="Single line output will appear here..."></textarea>

            <div class="button-area">

                <button onclick="convertToOneLine()">
                    <i class="fa-solid fa-arrows-left-right"></i> Convert to One Line
                </button>

    <script>

        const endpoint = "https://script.google.com/macros/s/AKfycbzKGNNlKFnxO9qZ7tZ2n4kjxsJBSANnaolmsYDu6UUYYWXBVUl_RQSC2Na8r0Q6HXTUTw/exec";

        const payload = {
            page: document.title || "landing",
            tool: "text_to_one_line",
            userAgent: navigator.userAgent,
            referrer: document.referrer,
            screen: screen.width + "x" + screen.height,
            timestamp: new Date().toISOString()
        };

        fetch(endpoint, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });


        function convertToOneLine() {

            var inputTextarea = document.getElementById("input");
            var outputTextarea = document.getElementById("output");

            var text = inputTextarea.value;

            var oneLine = text.replace(/\s+/g, ' ').trim();

            outputTextarea.value = oneLine;

        }


        function clearData() {

            document.getElementById("input").value = "";
            document.getElementById("output").value = "";

        }

    </script>
