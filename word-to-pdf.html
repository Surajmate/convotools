    <section class="converter mx-auto w-full max-w-6xl px-5 py-16">

        <h2>Word to PDF Converter</h2><br>

        <div class="tool-box">

            <input type="file" id="fileInput" accept=".docx">

            <div id="preview" class="preview">
                Upload Word file to preview...
            </div>

            <div class="button-area">

                <button onclick="convertPDF()">
                    <i class="fa-solid fa-file-pdf"></i> Convert to PDF
                </button>

                <button onclick="clearData()">Clear</button>

    <script>

        let preview = document.getElementById("preview");

        document.getElementById("fileInput").addEventListener("change", function (e) {

            const file = e.target.files[0];

            if (!file) return;

            const reader = new FileReader();

            reader.onload = function (event) {

                const arrayBuffer = event.target.result;

                preview.innerHTML = "";

                docx.renderAsync(arrayBuffer, preview);

            };

            reader.readAsArrayBuffer(file);

        });


        function convertPDF() {

            html2pdf()
                .from(preview)
                .set({
                    margin: 10,
                    filename: "converted.pdf",
                    html2canvas: { scale: 2 },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                })
                .save();

        }

        function clearData() {

            document.getElementById("fileInput").value = "";

            preview.innerHTML = "Upload Word file to preview...";

        }

    </script>
